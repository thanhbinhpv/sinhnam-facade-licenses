<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sinh Nam FACADE — License</title>
  <style>
    :root{font-family:Segoe UI,Arial,sans-serif;color:#172033;background:#f3f6f9}*{box-sizing:border-box}body{margin:0}.bar{background:#064a35;color:#fff;padding:15px 22px;display:flex;align-items:center;justify-content:space-between}.bar h1{font-size:20px;margin:0}main{max-width:1050px;margin:22px auto;padding:0 16px}.card{background:#fff;border:1px solid #dce4ea;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 4px 16px #17304712}.connect{display:grid;grid-template-columns:1fr auto;gap:9px}.add{display:grid;grid-template-columns:180px 1fr 1fr auto;gap:10px;align-items:end}label{font-size:12px;font-weight:700;color:#536274;display:block;margin-bottom:5px}input{width:100%;border:1px solid #c7d2dc;border-radius:8px;padding:9px;font:inherit}button{border:0;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer}.green{background:#087a55;color:#fff}.gray{background:#e8eef2;color:#263544}.red{background:#c93838;color:#fff}.yellow{background:#e8a61b;color:#241b00}.keyrow{display:flex;gap:6px}.keyrow input{font-family:Consolas,monospace}.status{font-size:13px;margin-top:10px;color:#526276}.ok{color:#087347}.bad{color:#b22626}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 8px;border-bottom:1px solid #e4e9ee;text-align:left}th{color:#536274}.mono{font-family:Consolas,monospace}.actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}.pill{padding:3px 7px;border-radius:20px;background:#dcf4e8;color:#09603f;font-weight:700}.blocked{background:#ffe2e2;color:#9b2424}@media(max-width:760px){.add{grid-template-columns:1fr}.connect{grid-template-columns:1fr}.actions{justify-content:flex-start}table{display:block;overflow:auto}}
  </style>
</head>
<body>
  <header class="bar"><h1>Sinh Nam FACADE — License</h1><strong id="count">0 license</strong></header>
  <main>
    <section class="card"><div class="connect"><input id="token" type="password" autocomplete="off" placeholder="GitHub token — Contents: Read and write"><button class="green" id="connect">Kết nối</button></div><div id="status" class="status">Nhập token để tải dữ liệu quản lý.</div></section>
    <section class="card"><div class="add"><div><label>Ngày hết hạn</label><input id="expiry" type="date"></div><div><label>License key</label><div class="keyrow"><input id="licenseKey"><button class="gray" id="random">Random</button></div></div><div><label>Ghi chú</label><input id="note" placeholder="Tên khách hàng hoặc ghi chú"></div><button class="green" id="add">Add license</button></div></section>
    <section class="card"><table><thead><tr><th>Trạng thái</th><th>License key</th><th>Hết hạn</th><th>Ghi chú</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="5">Chưa tải dữ liệu.</td></tr></tbody></table></section>
  </main>
<script>
const OWNER='thanhbinhpv',ADMIN_REPO='sinhnam-facade-license-admin',PUBLIC_REPO='sinhnam-facade-licenses',BRANCH='main';
const $=s=>document.querySelector(s),enc=new TextEncoder();let db={version:2,devices:[]},adminSha=null;
const norm=s=>(s||'').trim().toUpperCase(),hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const b64=b=>{let s='';for(const x of b)s+=String.fromCharCode(x);return btoa(s)},unb64=s=>Uint8Array.from(atob((s||'').replace(/\s/g,'')),c=>c.charCodeAt(0));
const textB64=s=>b64(enc.encode(s)),fromB64=s=>new TextDecoder().decode(unb64(s));
async function sha(s){return hex(await crypto.subtle.digest('SHA-256',enc.encode(norm(s)))).toUpperCase()}
function status(s,ok=true){$('#status').textContent=s;$('#status').className='status '+(ok?'ok':'bad')}
function token(){return $('#token').value.trim()||sessionStorage.getItem('snf-token')||''}
async function api(path,opt={}){const r=await fetch('https://api.github.com'+path,{...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+token(),'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}});if(r.status===204)return null;const x=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(x.message||('GitHub HTTP '+r.status));e.status=r.status;throw e}return x}
async function getFile(repo,path){try{return await api(`/repos/${OWNER}/${repo}/contents/${path}?ref=${BRANCH}`)}catch(e){if(e.status===404)return null;throw e}}
async function putFile(repo,path,text,message,oldSha){const body={message,content:textB64(text),branch:BRANCH};if(oldSha)body.sha=oldSha;return api(`/repos/${OWNER}/${repo}/contents/${path}`,{method:'PUT',body:JSON.stringify(body)})}
async function removeFile(repo,path,message){const f=await getFile(repo,path);if(f)await api(`/repos/${OWNER}/${repo}/contents/${path}`,{method:'DELETE',body:JSON.stringify({message,sha:f.sha,branch:BRANCH})})}
function plusYear(value){const d=value?new Date(value+'T00:00:00'):new Date();d.setFullYear(d.getFullYear()+1);return d.toISOString().slice(0,10)}
function randomKey(){const a=new Uint8Array(15);crypto.getRandomValues(a);const s=[...a].map(x=>(x%36).toString(36).toUpperCase()).join('');return `SNF-${s.slice(0,5)}-${s.slice(5,10)}-${s.slice(10,15)}`}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function render(){const list=db.devices||[];$('#count').textContent=list.length+' license';$('#rows').innerHTML=list.length?'':'<tr><td colspan="5">Chưa có license.</td></tr>';for(const d of list){const tr=document.createElement('tr');tr.innerHTML=`<td><span class="pill ${d.status==='blocked'?'blocked':''}">${escapeHtml(d.status||'active')}</span></td><td class="mono">${escapeHtml(d.licenseKey)}</td><td>${escapeHtml(d.expiresOn)}</td><td>${escapeHtml(d.note)}</td><td><div class="actions"><button class="gray" data-a="copy">Copy</button><button class="green" data-a="renew">+1 năm</button><button class="yellow" data-a="toggle">${d.status==='blocked'?'Mở':'Block'}</button><button class="red" data-a="delete">Xóa</button></div></td>`;tr.querySelectorAll('button').forEach(b=>b.onclick=()=>act(b.dataset.a,d));$('#rows').appendChild(tr)}}
async function connect(){try{sessionStorage.setItem('snf-token',$('#token').value.trim());const f=await getFile(ADMIN_REPO,'data/devices.json');db=f?JSON.parse(fromB64(f.content)):{version:2,devices:[]};db.devices=db.devices||[];adminSha=f&&f.sha;render();status('Đã đồng bộ với GitHub.')}catch(e){status(e.message,false)}}
async function saveDb(message){db.updatedAt=new Date().toISOString();const r=await putFile(ADMIN_REPO,'data/devices.json',JSON.stringify(db,null,2),message,adminSha);adminSha=r.content.sha}
async function envelope(d){const key=norm(d.licenseKey),salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(16));const legacy=d.pcName&&d.publicIp&&d.driveSerial;const password=legacy?`${key}|${norm(d.pcName)}|${norm(d.publicIp)}|${norm(d.driveSerial)}`:key;const base=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveBits']);const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:120000,hash:'SHA-1'},base,512)),aes=await crypto.subtle.importKey('raw',bits.slice(0,32),'AES-CBC',false,['encrypt']),mac=await crypto.subtle.importKey('raw',bits.slice(32),'HMAC',false,['sign']);let plain=`v=${legacy?'1':'2'}\nkeyHash=${await sha(key)}\n`;if(legacy)plain+=`pcHash=${await sha(d.pcName)}\nipHash=${await sha(d.publicIp)}\ndriveHash=${await sha(d.driveSerial)}\n`;plain+=`issuedUtc=${new Date().toISOString().slice(0,10)}\nexpiresUtc=${d.expiresOn}`;const cipher=new Uint8Array(await crypto.subtle.encrypt({name:'AES-CBC',iv},aes,enc.encode(plain))),all=new Uint8Array(32+cipher.length);all.set(salt);all.set(iv,16);all.set(cipher,32);const sig=new Uint8Array(await crypto.subtle.sign('HMAC',mac,all));return `${legacy?'SNF1':'SNF2'}\n${b64(salt)}\n${b64(iv)}\n${b64(cipher)}\n${b64(sig)}\n`}
async function publish(d){d.keyHash=await sha(d.licenseKey);const path=`licenses/${d.keyHash.toLowerCase()}.lic`,old=await getFile(PUBLIC_REPO,path);await putFile(PUBLIC_REPO,path,await envelope(d),`Publish license ${d.keyHash.slice(0,12)} through ${d.expiresOn}`,old&&old.sha)}
async function add(){try{if(!adminSha)throw new Error('Kết nối GitHub trước.');const d={id:crypto.randomUUID(),status:'active',licenseKey:norm($('#licenseKey').value),expiresOn:$('#expiry').value,note:$('#note').value.trim(),updatedAt:new Date().toISOString()};if(!d.licenseKey||!d.expiresOn)throw new Error('Nhập ngày hết hạn và license key.');if(db.devices.some(x=>norm(x.licenseKey)===d.licenseKey))throw new Error('License key đã tồn tại.');await publish(d);db.devices.unshift(d);await saveDb('Add license '+d.keyHash.slice(0,12));render();$('#licenseKey').value=randomKey();$('#note').value='';status('Đã thêm và tự xuất bản license lên GitHub.')}catch(e){status(e.message,false)}}
async function act(a,d){try{if(a==='copy'){await navigator.clipboard.writeText(d.licenseKey);return status('Đã copy license key.')}if(a==='renew'){d.expiresOn=plusYear(d.expiresOn);d.status='active';await publish(d);await saveDb('Renew license '+d.keyHash.slice(0,12));status('Đã gia hạn và tự đồng bộ file license.')}if(a==='toggle'){d.status=d.status==='blocked'?'active':'blocked';if(d.status==='active')await publish(d);else await removeFile(PUBLIC_REPO,`licenses/${d.keyHash.toLowerCase()}.lic`,'Block license '+d.keyHash.slice(0,12));await saveDb((d.status==='active'?'Unblock ':'Block ')+d.keyHash.slice(0,12));status('Đã đồng bộ trạng thái.')}if(a==='delete'){if(!confirm('Xóa license này?'))return;await removeFile(PUBLIC_REPO,`licenses/${d.keyHash.toLowerCase()}.lic`,'Delete license '+d.keyHash.slice(0,12));db.devices=db.devices.filter(x=>x.id!==d.id);await saveDb('Delete license '+d.keyHash.slice(0,12));status('Đã xóa và đồng bộ GitHub.')}render()}catch(e){status(e.message,false)}}
$('#connect').onclick=connect;$('#random').onclick=()=>$('#licenseKey').value=randomKey();$('#add').onclick=add;$('#expiry').value=plusYear();$('#licenseKey').value=randomKey();if(sessionStorage.getItem('snf-token'))connect();
</script>
</body>
</html>
